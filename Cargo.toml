[[bin]]
name = "River"
path = "Source/River.rs"

[build-dependencies]
serde = { version = "1.0.216", features = ["derive"] }
serde_json = { version = "1.0.133" }
toml = { version = "0.8.19" }

[dependencies]
Echo = { version = "0.0.1", path = "../Echo" }
async-trait = "0.1.83"
# TODO: To implement
# dashmap = "6.0.1"
futures = { version = "0.3.31" }
serde = { version = "1.0.216", features = ["derive"] }
tokio = { version = "1.42.0", features = ["full"] }
tokio-tungstenite = "0.26.0"
unbug = { version = "0.4.0" }

[package]
autobenches = false
autobins = false
autoexamples = false
autotests = false
publish = false
default-run = "River"
description = "🌊 River —"
license-file = "LICENSE"
name = "River"
repository = "https://github.com/CodeEditorLand/River"
version = "0.0.1"
edition = "2021"

[features]
default = []
